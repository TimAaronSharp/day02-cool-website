<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Coolsite</title>
</head>

<body class="no-margin">
  <header class="display-flex align-items-center justify-content-space-around white-text padding-bottom">
    <img src="images/HordeCrest.webp" alt="Horde Crest" class="max-width-crests">
    <button class="navbar">Home</button>
    <button class="navbar">Factions</button>
    <button class="navbar">Classes</button>
    <button class="navbar">World</button>
    <button class="navbar">Community</button>
    <button class="navbar">Support</button>
    <img src="images/AllianceCrest.webp" alt="Alliance Crest" class="max-width-crests">
  </header>
  <main class="display-flex margin-top-paragraph position-absolute margin-left-paragraph">
    <h2 class="no-margin no-padding white-text">Azeroth has forgotten the feeling of peace
    </h2>
    <div class="display-flex horde-button-positioning position-absolute">
      <button class="horde-button-color border">For the Horde!</button>
    </div>
    <div class="display-flex no-margin alliance-button-positioning position-absolute">
      <button class="alliance-button-color border">For the Alliance!</button>
    </div>
  </main>
  <div
    class="margin-top-2nd-paragraph position-absolute margin-left-2nd-paragraph paragraph-2nd-max-width word-wrap-break-word">
    <h5 class="white-text">As the drums of war thunder once again it's people prepare for the inevitable. Heroes from
      every corner of the globe rally to answer the call.</h5>
  </div>
  <img src="images/wow.webp" alt="An orc and human from Warcraft facing off" class="max-width-background">


</body>

</html>
<!-- alliance-button-positioning position-absolute -->
